  # ---------------------------------------------------------------------
  # Task 9d, secondary rungs. Task 9c's ladder found no size boundary: every
  # rung from <System> alone up to the full 12-Data-pair control fails
  # identically. This task's own decisive experiment -- an all-literal,
  # zero-substitution record -- could not be built (see task-9d-report.md's
  # "all-literal variant" section: MS-EVEN6's own ABNF grammar defines
  # ValueText as ValueTextToken StringType LengthPrefixedUnicodeString, with
  # no alternative production for a non-string literal, confirmed
  # independently against testdata/system.evtx itself -- 15/15 real
  # ValueText occurrences across two records and their nested UserData/
  # EventData sub-templates are StringType, 0 exceptions). These two rungs
  # are the batched secondary experiments the same task asked for instead,
  # isolating two mechanisms that have been present in every measurement
  # since they were adopted but never independently varied:
  #
  # Rung A (all-normal-sub): every OptionalSubstitution (0x0E) token
  # binxml.go's <System> block uses (task 8b/F12c, task 8c/F13a) reverted to
  # NormalSubstitution (0x0D), with dependency_id reset to the sentinel
  # (0xffff) wherever it used to name a real index. Isolates whether 0x0E
  # itself -- adopted from reading the real file, never tested on its own --
  # is required.
  #
  # Rung B (no-xmlns): <Event>'s xmlns attribute (F8, task 8) removed
  # entirely. Expected to break python-evtx's own namespaced XPath query
  # (scripts/verify_python_evtx_no_xmlns.py asserts this prediction
  # directly, rather than merely describing it) -- its own fixture and its
  # own jobs, with get-winevent-ladder-no-xmlns depending only on
  # generate-ladder-no-xmlns (never on the python job), so that expected
  # Linux failure cannot skip or gate the independent Windows measurement --
  # the same class of wiring defect Task 1's own baseline harness found and
  # fixed early in this release.
  #
  # Both rungs are the control's own scale (System + EventData, 12
  # substituted-name Data pairs -- production's own convention) so each
  # differs from the other, and from the existing control (rung 3,
  # generate-minimal/get-winevent-minimal), in exactly the one variable it
  # is named for.
  # ---------------------------------------------------------------------
  generate-ladder-all-normal-sub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
