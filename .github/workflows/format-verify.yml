name: Format Verify
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  python-evtx-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Generate fixture
        run: |
          mkdir -p artifacts
          go run ./cmd/gen-fixture -out artifacts
      - name: Parse with python-evtx
        run: |
          uv venv
          uv pip install python-evtx
          uv run python scripts/verify_python_evtx.py artifacts/generated.evtx artifacts/expected.json
      # always(): the fixture is generated before the checker runs, so it
      # should still be uploaded even when the checker step fails (a FAIL is
      # exactly the result this workflow exists to capture) — otherwise the
      # get-winevent job below would have nothing to download.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-evtx
          path: artifacts/
          retention-days: 7

  get-winevent:
    needs: python-evtx-differential
    # !cancelled(): run even when python-evtx-differential fails. A failing
    # checker is the expected pre-fix result, not a reason to skip the
    # Windows leg — both jobs' real output is the deliverable of this task.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v5
        with:
          name: generated-evtx
          path: artifacts
      - name: Parse with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (Get-Content artifacts/expected.json | ConvertFrom-Json)

          # Get-WinEvent returns a scalar for a single record; coerce to an array.
          $events = @(Get-WinEvent -Path artifacts/generated.evtx -ErrorAction Stop)

          if ($events.Count -ne $expected.record_count) {
              throw "record count mismatch: got $($events.Count), want $($expected.record_count)"
          }

          # Count alone proves nothing — a parser returning the right number of
          # empty records would pass. Check content survives the round trip.
          $first = $events[0]
          $xml = [xml]$first.ToXml()
          $objectName = ($xml.Event.EventData.Data | Where-Object { $_.Name -eq 'ObjectName' }).'#text'
          if ($objectName -ne $expected.object_names[0]) {
              throw "ObjectName mismatch: got '$objectName', want '$($expected.object_names[0])'"
          }

          Write-Host "OK: $($events.Count) records, ObjectName round-trips"
