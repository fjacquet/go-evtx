name: Format Verify
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate fixture
        run: |
          mkdir -p artifacts
          go run ./cmd/gen-fixture -out artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evtx
          path: artifacts/
          retention-days: 7

  python-evtx-differential:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-evtx
          path: artifacts
      - name: Parse with python-evtx
        run: |
          uv venv
          # Pinned: every row in docs/format-baseline.md's measurement table was
          # produced by this exact version. An unpinned `install` resolves
          # whatever is latest at workflow runtime, so two measurement rows
          # could differ for a reason that has nothing to do with go-evtx --
          # silently invalidating the whole comparison chain the release relies
          # on. Bump deliberately, and only alongside a note in
          # docs/format-baseline.md that a later row's parser version changed.
          uv pip install python-evtx==0.8.1
          uv run python scripts/verify_python_evtx.py artifacts/generated.evtx artifacts/expected.json

  get-winevent:
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-evtx
          path: artifacts
      - name: Parse with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Stage 1: can the log be opened at all? A FileNotFound/InvalidData
          # here is an open-time rejection -- the parser never reached a
          # record. This is diagnostic scaffolding in front of the
          # Get-WinEvent assertions below, not a replacement for them: the
          # single $events = @(Get-WinEvent ...) call the assertions use
          # enumerates eagerly, so it cannot tell an open-time throw from a
          # record-1 decode throw apart on its own.
          try {
              $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new(
                  [System.Diagnostics.Eventing.Reader.EventLogQuery]::new(
                      'artifacts/generated.evtx',
                      [System.Diagnostics.Eventing.Reader.PathType]::FilePath))
              Write-Host "STAGE1 OPEN: ok"
          } catch {
              Write-Host "STAGE1 OPEN: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          # Stage 2: read records one at a time, so a decode failure names
          # its record.
          $n = 0
          try {
              while ($true) {
                  $rec = $reader.ReadEvent()
                  if ($null -eq $rec) { break }
                  $n++
              }
              Write-Host "STAGE2 READ: ok, $n records"
          } catch {
              Write-Host "STAGE2 READ: FAILED after $n records - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          $expected = (Get-Content artifacts/expected.json | ConvertFrom-Json)

          # Get-WinEvent enumerates newest-first by default. Stage 2 above
          # reads forward and (as of this task) succeeds; reverse iteration
          # depends on metadata forward reading never touches --
          # LastEventRecordNumber/LastEventRecordDataOffset in the chunk
          # header, LastChunkNumber/NextRecordIdentifier in the file header.
          # Run both orderings independently and report each on its own line
          # -- do not replace one with the other, since the difference
          # between them is itself the finding.

          # Default order (newest-first) — the historical assertion.
          $events = $null
          $errDefault = $null
          try {
              $events = @(Get-WinEvent -Path artifacts/generated.evtx -ErrorAction Stop)
              Write-Host "GETWINEVENT default: ok, $($events.Count) records"
          } catch {
              $errDefault = $_
              Write-Host "GETWINEVENT default: FAILED - $($_.Exception.Message)"
          }

          # Forward order.
          $oldest = $null
          $errOldest = $null
          try {
              $oldest = @(Get-WinEvent -Path artifacts/generated.evtx -Oldest -ErrorAction Stop)
              Write-Host "GETWINEVENT -Oldest: ok, $($oldest.Count) records"
          } catch {
              $errOldest = $_
              Write-Host "GETWINEVENT -Oldest: FAILED - $($_.Exception.Message)"
          }

          # Run the existing content assertions against whichever variant
          # succeeded, so a pass still means something. Prefer the default
          # order (the historical assertion) when both succeed.
          $verified = if ($null -ne $events) { $events } elseif ($null -ne $oldest) { $oldest } else { $null }

          if ($null -ne $verified) {
              if ($verified.Count -ne $expected.record_count) {
                  throw "record count mismatch: got $($verified.Count), want $($expected.record_count)"
              }

              # Count alone proves nothing — a parser returning the right number of
              # empty records would pass. Check content survives the round trip.
              $first = $verified[0]
              $xml = [xml]$first.ToXml()
              $objectName = ($xml.Event.EventData.Data | Where-Object { $_.Name -eq 'ObjectName' }).'#text'
              if ($objectName -ne $expected.object_names[0]) {
                  throw "ObjectName mismatch: got '$objectName', want '$($expected.object_names[0])'"
              }

              Write-Host "OK: $($verified.Count) records, ObjectName round-trips (variant: $(if ($null -ne $events) { 'default' } else { '-Oldest' }))"
          }

          # The job must still fail while either ordering is broken -- do
          # not weaken this to "at least one succeeded". No continue-on-error,
          # no softened assertion: report both failures together so a rerun
          # doesn't need to be re-triaged from scratch.
          if ($null -ne $errDefault -or $null -ne $errOldest) {
              $failures = @()
              if ($null -ne $errDefault) { $failures += "default: $($errDefault.Exception.Message)" }
              if ($null -ne $errOldest) { $failures += "-Oldest: $($errOldest.Exception.Message)" }
              throw "Get-WinEvent ordering(s) failed: $($failures -join '; ')"
          }
