  # ---------------------------------------------------------------------
  # Task 9e: task 9d's own ladder found no size boundary (task 9c) and could
  # not build its decisive all-literal experiment at all -- MS-EVEN6's own
  # grammar has no ValueText production for a non-string type, so every
  # typed scalar MUST be a substitution (verified against
  # testdata/system.evtx: 35/35 real substitutions there are typed, 15/15
  # real literals are all StringType, zero exceptions -- task-9d-report.md).
  # What has never been isolated, across every measurement this release has
  # made, is the declared VALUE TYPE of each substitution.
  #
  # Decisive (all-string): every one of the control's 42 substitutions
  # (System's 18 plus EventData's 12 Data pairs) declared StringType (0x01)
  # -- both the template body's own substitution tokens and the
  # substitution array's value-spec descriptors, kept consistent by
  # construction (evtx.VariantAllString, binxml_variants.go) -- each value
  # reformatted as it would render in XML (decimal digits for an integer,
  # hex for Keywords, ISO-8601 for the FILETIME, empty string for a field
  # with no source). If this renders, the defect is a type mismatch on one
  # specific substitution -- a small target for a follow-up bisect. If it
  # still fails, value types are exonerated as a category and what remains
  # is the template body's own element/token encoding.
  #
  # Secondary rung (four-string), batched into the same run: production's
  # own declared types unchanged EXCEPT for the four substitutions whose
  # types were never independently verified as strings --
  # Security/@UserID, Execution/@ProcessID, Execution/@ThreadID, Keywords
  # -- the four positions task-8b-report.md's own Step 1 type table was
  # later shown wrong about (F14, task 8e's correction note), so they carry
  # the least evidence of any declared type in the template
  # (evtx.VariantFourFieldsString).
  #
  # Both are control-scale (System + EventData, 12 substituted-name Data
  # pairs, xmlns present, production's own OptionalSubstitution/
  # dependency_id convention unchanged -- that axis was already isolated as
  # a null result by task 9d's VariantAllNormalSubstitution) so each rung
  # differs from the existing control (rung 3, generate-minimal/
  # get-winevent-minimal) in exactly the variable it is named for. xmlns
  # stays present in both, so python-evtx is expected to behave like the
