name: Format Verify
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate fixture
        run: |
          mkdir -p artifacts
          go run ./cmd/gen-fixture -out artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evtx
          path: artifacts/
          retention-days: 7

  python-evtx-differential:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-evtx
          path: artifacts
      - name: Parse with python-evtx
        run: |
          uv venv
          # Pinned: every row in docs/format-baseline.md's measurement table was
          # produced by this exact version. An unpinned `install` resolves
          # whatever is latest at workflow runtime, so two measurement rows
          # could differ for a reason that has nothing to do with go-evtx --
          # silently invalidating the whole comparison chain the release relies
          # on. Bump deliberately, and only alongside a note in
          # docs/format-baseline.md that a later row's parser version changed.
          uv pip install python-evtx==0.8.1
          uv run python scripts/verify_python_evtx.py artifacts/generated.evtx artifacts/expected.json

  get-winevent:
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-evtx
          path: artifacts
      - name: Parse with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Stage 1: can the log be opened at all? A FileNotFound/InvalidData
          # here is an open-time rejection -- the parser never reached a
          # record. This is diagnostic scaffolding in front of the
          # Get-WinEvent assertions below, not a replacement for them: the
          # single $events = @(Get-WinEvent ...) call the assertions use
          # enumerates eagerly, so it cannot tell an open-time throw from a
          # record-1 decode throw apart on its own.
          try {
              $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new(
                  [System.Diagnostics.Eventing.Reader.EventLogQuery]::new(
                      'artifacts/generated.evtx',
                      [System.Diagnostics.Eventing.Reader.PathType]::FilePath))
              Write-Host "STAGE1 OPEN: ok"
          } catch {
              Write-Host "STAGE1 OPEN: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          # Stage 2: read records one at a time, so a decode failure names
          # its record. Also capture the first record returned: Get-WinEvent
          # can fail before it ever hands back an EventRecord, so this is
          # the only EventRecord instance the rest of this script can probe
          # on a run where both Get-WinEvent orderings fail.
          $n = 0
          $firstNative = $null
          try {
              while ($true) {
                  $rec = $reader.ReadEvent()
                  if ($null -eq $rec) { break }
                  if ($n -eq 0) { $firstNative = $rec }
                  $n++
              }
              Write-Host "STAGE2 READ: ok, $n records"
          } catch {
              Write-Host "STAGE2 READ: FAILED after $n records - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          # Probe A: does Get-WinEvent's failure come from log-level metadata
          # -- NextRecordIdentifier, LastChunkNumber, the dirty/full flags,
          # the record count -- that EventLogReader's open+ReadEvent() path
          # above never touches? EventLogSession.GetLogInformation() reads
          # exactly that metadata on its own, independent of enumerating any
          # record. Non-fatal: reported, not thrown, so later probes still run.
          try {
              $sess = New-Object System.Diagnostics.Eventing.Reader.EventLogSession
              $info = $sess.GetLogInformation('artifacts/generated.evtx',
                        [System.Diagnostics.Eventing.Reader.PathType]::FilePath)
              Write-Host "LOGINFO: ok - records=$($info.RecordCount) oldest=$($info.OldestRecordNumber) full=$($info.IsLogFull)"
          } catch {
              Write-Host "LOGINFO: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }

          # Probe B: does the failure come from touching a record's
          # properties rather than from parsing it? Stage 2 above reads
          # records but never reads a field off one. EventRecord's
          # properties are lazily resolved, so probe each individually
          # against the record the raw reader already returned -- one
          # failure per property, not a single all-or-nothing exception.
          if ($null -ne $firstNative) {
              foreach ($p in 'Id','Level','ProviderName','TimeCreated','RecordId','MachineName') {
                  try   { $v = $firstNative.$p; Write-Host "PROP $p ok: $v" }
                  catch { Write-Host "PROP $p FAILED - $($_.Exception.Message)" }
              }
              try   { $null = $firstNative.ToXml(); Write-Host "PROP ToXml ok" }
              catch { Write-Host "PROP ToXml FAILED - $($_.Exception.Message)" }
          } else {
              Write-Host "PROP: skipped - no record captured from the raw reader"
          }

          $expected = (Get-Content artifacts/expected.json | ConvertFrom-Json)

          # Get-WinEvent enumerates newest-first by default. Stage 2 above
          # reads forward and (as of this task) succeeds; reverse iteration
          # depends on metadata forward reading never touches --
          # LastEventRecordNumber/LastEventRecordDataOffset in the chunk
          # header, LastChunkNumber/NextRecordIdentifier in the file header.
          # Run both orderings independently and report each on its own line
          # -- do not replace one with the other, since the difference
          # between them is itself the finding.

          # Default order (newest-first) — the historical assertion.
          $events = $null
          $errDefault = $null
          try {
              $events = @(Get-WinEvent -Path artifacts/generated.evtx -ErrorAction Stop)
              Write-Host "GETWINEVENT default: ok, $($events.Count) records"
          } catch {
              $errDefault = $_
              Write-Host "GETWINEVENT default: FAILED - $($_.Exception.Message)"
          }

          # Forward order.
          $oldest = $null
          $errOldest = $null
          try {
              $oldest = @(Get-WinEvent -Path artifacts/generated.evtx -Oldest -ErrorAction Stop)
              Write-Host "GETWINEVENT -Oldest: ok, $($oldest.Count) records"
          } catch {
              $errOldest = $_
              Write-Host "GETWINEVENT -Oldest: FAILED - $($_.Exception.Message)"
          }

          # Run the existing content assertions against whichever variant
          # succeeded, so a pass still means something. Prefer the default
          # order (the historical assertion) when both succeed.
          $verified = if ($null -ne $events) { $events } elseif ($null -ne $oldest) { $oldest } else { $null }

          if ($null -ne $verified) {
              if ($verified.Count -ne $expected.record_count) {
                  throw "record count mismatch: got $($verified.Count), want $($expected.record_count)"
              }

              # Count alone proves nothing — a parser returning the right number of
              # empty records would pass. Check content survives the round trip.
              $first = $verified[0]
              $xml = [xml]$first.ToXml()
              $objectName = ($xml.Event.EventData.Data | Where-Object { $_.Name -eq 'ObjectName' }).'#text'
              if ($objectName -ne $expected.object_names[0]) {
                  throw "ObjectName mismatch: got '$objectName', want '$($expected.object_names[0])'"
              }

              Write-Host "OK: $($verified.Count) records, ObjectName round-trips (variant: $(if ($null -ne $events) { 'default' } else { '-Oldest' }))"
          }

          # The job must still fail while either ordering is broken -- do
          # not weaken this to "at least one succeeded". No continue-on-error,
          # no softened assertion: report both failures together so a rerun
          # doesn't need to be re-triaged from scratch.
          if ($null -ne $errDefault -or $null -ne $errOldest) {
              $failures = @()
              if ($null -ne $errDefault) { $failures += "default: $($errDefault.Exception.Message)" }
              if ($null -ne $errOldest) { $failures += "-Oldest: $($errOldest.Exception.Message)" }
              throw "Get-WinEvent ordering(s) failed: $($failures -join '; ')"
          }

  # ---------------------------------------------------------------------
  # Experiment A (task-9a): a second, minimal fixture -- one record, one
  # chunk, pure ASCII, no boundary cases -- run through the same probe
  # sequence as the main fixture above. Added beside the existing
  # generate/get-winevent jobs, which stay untouched: this isolates whether
  # a render failure needs the big fixture's surface (403 records, 21+
  # chunks, non-BMP strings, a near-maximum record) or reproduces on the
  # simplest record this library can produce.
  # ---------------------------------------------------------------------
  generate-minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate minimal fixture
        run: |
          mkdir -p artifacts-minimal
          go run ./cmd/gen-fixture-minimal -out artifacts-minimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimal-evtx
          path: artifacts-minimal/
          retention-days: 7

  get-winevent-minimal:
    needs: generate-minimal
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minimal-evtx
          path: artifacts-minimal
      - name: Parse minimal fixture with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts-minimal/minimal.evtx'

          try {
              $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new(
                  [System.Diagnostics.Eventing.Reader.EventLogQuery]::new(
                      $path, [System.Diagnostics.Eventing.Reader.PathType]::FilePath))
              Write-Host "MINIMAL STAGE1 OPEN: ok"
          } catch {
              Write-Host "MINIMAL STAGE1 OPEN: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          # Unlike the main fixture's job, a STAGE2 READ failure here does NOT
          # abort the script: with only one record, throwing here would skip
          # ToXml/Get-WinEvent too and cost a second CI round trip to learn
          # what those report. Every probe below runs regardless, and the
          # final assertion still fails the job if Get-WinEvent itself fails
          # -- that is what keeps this job's red/green status meaningful.
          $n = 0
          $firstNative = $null
          try {
              while ($true) {
                  $rec = $reader.ReadEvent()
                  if ($null -eq $rec) { break }
                  if ($n -eq 0) { $firstNative = $rec }
                  $n++
              }
              Write-Host "MINIMAL STAGE2 READ: ok, $n records"
          } catch {
              Write-Host "MINIMAL STAGE2 READ: FAILED after $n records - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }

          if ($null -ne $firstNative) {
              try   { $null = $firstNative.ToXml(); Write-Host "MINIMAL PROP ToXml ok" }
              catch { Write-Host "MINIMAL PROP ToXml FAILED - $($_.Exception.Message)" }
          } else {
              Write-Host "MINIMAL PROP ToXml: skipped - no record captured from the raw reader"
          }

          $errDefault = $null
          try {
              $events = @(Get-WinEvent -Path $path -ErrorAction Stop)
              Write-Host "MINIMAL GETWINEVENT default: ok, $($events.Count) records"
          } catch {
              $errDefault = $_
              Write-Host "MINIMAL GETWINEVENT default: FAILED - $($_.Exception.Message)"
          }

          $errOldest = $null
          try {
              $oldest = @(Get-WinEvent -Path $path -Oldest -ErrorAction Stop)
              Write-Host "MINIMAL GETWINEVENT -Oldest: ok, $($oldest.Count) records"
          } catch {
              $errOldest = $_
              Write-Host "MINIMAL GETWINEVENT -Oldest: FAILED - $($_.Exception.Message)"
          }

          if ($null -ne $errDefault -or $null -ne $errOldest) {
              $failures = @()
              if ($null -ne $errDefault) { $failures += "default: $($errDefault.Exception.Message)" }
              if ($null -ne $errOldest) { $failures += "-Oldest: $($errOldest.Exception.Message)" }
              throw "Get-WinEvent ordering(s) failed on minimal fixture: $($failures -join '; ')"
          }

  # ---------------------------------------------------------------------
  # Experiment B (task-9a): splice a REAL record's BinXML (extracted from
  # testdata/system.evtx chunk 0 record 0, verified self-contained -- see
  # cmd/gen-splice-fixture/main.go's doc comment) into one of go-evtx's own
  # chunks via WriteRaw, then run it through the same probes. Separates
  # "our chunk/file container is wrong" from "our BinXML generation is
  # wrong" -- nothing measured before this task distinguishes those two.
  # ---------------------------------------------------------------------
  generate-splice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate spliced fixture
        run: |
          mkdir -p artifacts-splice
          go run ./cmd/gen-splice-fixture -out artifacts-splice
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spliced-evtx
          path: artifacts-splice/
          retention-days: 7

  get-winevent-splice:
    needs: generate-splice
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spliced-evtx
          path: artifacts-splice
      - name: Parse spliced fixture with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts-splice/spliced.evtx'

          try {
              $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new(
                  [System.Diagnostics.Eventing.Reader.EventLogQuery]::new(
                      $path, [System.Diagnostics.Eventing.Reader.PathType]::FilePath))
              Write-Host "SPLICE STAGE1 OPEN: ok"
          } catch {
              Write-Host "SPLICE STAGE1 OPEN: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          # See the minimal-fixture job above for why STAGE2 READ does not
          # abort the script here.
          $n = 0
          $firstNative = $null
          try {
              while ($true) {
                  $rec = $reader.ReadEvent()
                  if ($null -eq $rec) { break }
                  if ($n -eq 0) { $firstNative = $rec }
                  $n++
              }
              Write-Host "SPLICE STAGE2 READ: ok, $n records"
          } catch {
              Write-Host "SPLICE STAGE2 READ: FAILED after $n records - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }

          if ($null -ne $firstNative) {
              try   { $null = $firstNative.ToXml(); Write-Host "SPLICE PROP ToXml ok" }
              catch { Write-Host "SPLICE PROP ToXml FAILED - $($_.Exception.Message)" }
          } else {
              Write-Host "SPLICE PROP ToXml: skipped - no record captured from the raw reader"
          }

          $errDefault = $null
          try {
              $events = @(Get-WinEvent -Path $path -ErrorAction Stop)
              Write-Host "SPLICE GETWINEVENT default: ok, $($events.Count) records"
          } catch {
              $errDefault = $_
              Write-Host "SPLICE GETWINEVENT default: FAILED - $($_.Exception.Message)"
          }

          $errOldest = $null
          try {
              $oldest = @(Get-WinEvent -Path $path -Oldest -ErrorAction Stop)
              Write-Host "SPLICE GETWINEVENT -Oldest: ok, $($oldest.Count) records"
          } catch {
              $errOldest = $_
              Write-Host "SPLICE GETWINEVENT -Oldest: FAILED - $($_.Exception.Message)"
          }

          if ($null -ne $errDefault -or $null -ne $errOldest) {
              $failures = @()
              if ($null -ne $errDefault) { $failures += "default: $($errDefault.Exception.Message)" }
              if ($null -ne $errOldest) { $failures += "-Oldest: $($errOldest.Exception.Message)" }
              throw "Get-WinEvent ordering(s) failed on spliced fixture: $($failures -join '; ')"
          }

  # ---------------------------------------------------------------------
  # Task 9b hybrids: task-9a localised the defect to buildBinXML/
  # buildTemplateBody's own encoding (binxml.go), but not to which byte(s).
  # These three hybrids bisect by construction -- each is a payload built
  # from the two CI-proven payloads task-9a already produced (the real
  # testdata/system.evtx chunk 0 record 0 BinXML that Get-WinEvent accepts,
  # and go-evtx's own minimal-fixture BinXML that it rejects), with one
  # structural region swapped between them and every position-dependent
  # offset explicitly recomputed (see each cmd/gen-hybrid-*/main.go's own
  # doc comment for the exact offset-safety argument). Added beside the
  # existing jobs, which are untouched.
  #
  # Hybrid 1 (preamble-ours) and Hybrid 2 (preamble-real): cut point 1, the
  # brief's "fixed preamble" -- swap only the TemplateInstanceNode's
  # template_id and the TemplateNode header's GUID (pure identity/cache
  # metadata, referenced by nothing else in either payload, so this needs
  # no offset rewriting at all -- see gen-hybrid-preamble-ours's doc
  # comment). Hybrid 1 takes the real, already-passing record and swaps in
  # go-evtx's own trivial ID values; Hybrid 2 takes go-evtx's own failing
  # record and swaps in the real file's ID values. Symmetric, both cheap.
  #
  # Hybrid 3 (selfclose): cut point 3, "individual <System> children" --
  # a structural walk of the real record found its <System> block has the
  # SAME 14 children in the SAME order with the SAME declared substitution
  # types as go-evtx's own, and exactly one measured divergence: 5
  # attribute-only, no-content children (Provider, TimeCreated,
  # Correlation, Execution, Security) close via CloseEmptyElementTag
  # (0x03, no separate EndElementTag) in the real file, but via
  # CloseStartElementTag (0x02) plus a separate EndElementTag in go-evtx's
  # own output -- a fact attrlist_test.go's own comment already named
  # ("go-evtx never emits the self-closing CloseEmptyElementTag") but never
  # tested for effect. This hybrid rewrites only those 5 elements' closing
  # bytes and recomputes every data_size/attr_list_size/name_offset/
  # data_length field the 5-byte-shorter payload implies, self-validated
  # by re-parsing before it is ever written to a file (see
  # cmd/gen-hybrid-selfclose/main.go's doc comment for the full method).
  # ---------------------------------------------------------------------
  generate-hybrid-preamble-ours:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate hybrid (real body/subs, our preamble IDs)
        run: |
          mkdir -p artifacts-hybrid-preamble-ours
          go run ./cmd/gen-hybrid-preamble-ours -out artifacts-hybrid-preamble-ours
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-preamble-ours-evtx
          path: artifacts-hybrid-preamble-ours/
          retention-days: 7

  get-winevent-hybrid-preamble-ours:
    needs: generate-hybrid-preamble-ours
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hybrid-preamble-ours-evtx
          path: artifacts-hybrid-preamble-ours
      - name: Parse hybrid (preamble-ours) with Get-WinEvent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts-hybrid-preamble-ours/hybrid-preamble-ours.evtx'

          try {
              $reader = [System.Diagnostics.Eventing.Reader.EventLogReader]::new(
                  [System.Diagnostics.Eventing.Reader.EventLogQuery]::new(
                      $path, [System.Diagnostics.Eventing.Reader.PathType]::FilePath))
              Write-Host "H1-PREAMBLE-OURS STAGE1 OPEN: ok"
          } catch {
              Write-Host "H1-PREAMBLE-OURS STAGE1 OPEN: FAILED - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
              throw
          }

          $n = 0
          $firstNative = $null
          try {
              while ($true) {
                  $rec = $reader.ReadEvent()
                  if ($null -eq $rec) { break }
                  if ($n -eq 0) { $firstNative = $rec }
                  $n++
              }
              Write-Host "H1-PREAMBLE-OURS STAGE2 READ: ok, $n records"
          } catch {
              Write-Host "H1-PREAMBLE-OURS STAGE2 READ: FAILED after $n records - $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }

          if ($null -ne $firstNative) {
              try   { $null = $firstNative.ToXml(); Write-Host "H1-PREAMBLE-OURS PROP ToXml ok" }
              catch { Write-Host "H1-PREAMBLE-OURS PROP ToXml FAILED - $($_.Exception.Message)" }
          } else {
              Write-Host "H1-PREAMBLE-OURS PROP ToXml: skipped - no record captured from the raw reader"
          }

          $errDefault = $null
          try {
              $events = @(Get-WinEvent -Path $path -ErrorAction Stop)
              Write-Host "H1-PREAMBLE-OURS GETWINEVENT default: ok, $($events.Count) records"
          } catch {
              $errDefault = $_
              Write-Host "H1-PREAMBLE-OURS GETWINEVENT default: FAILED - $($_.Exception.Message)"
          }

          $errOldest = $null
          try {
              $oldest = @(Get-WinEvent -Path $path -Oldest -ErrorAction Stop)
              Write-Host "H1-PREAMBLE-OURS GETWINEVENT -Oldest: ok, $($oldest.Count) records"
          } catch {
              $errOldest = $_
              Write-Host "H1-PREAMBLE-OURS GETWINEVENT -Oldest: FAILED - $($_.Exception.Message)"
          }

          if ($null -ne $errDefault -or $null -ne $errOldest) {
              $failures = @()
              if ($null -ne $errDefault) { $failures += "default: $($errDefault.Exception.Message)" }
              if ($null -ne $errOldest) { $failures += "-Oldest: $($errOldest.Exception.Message)" }
              throw "Get-WinEvent ordering(s) failed on hybrid-preamble-ours fixture: $($failures -join '; ')"
          }

  generate-hybrid-preamble-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generate hybrid (our body/subs, real preamble IDs)
        run: |
          mkdir -p artifacts-hybrid-preamble-real
          go run ./cmd/gen-hybrid-preamble-real -out artifacts-hybrid-preamble-real
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-preamble-real-evtx
