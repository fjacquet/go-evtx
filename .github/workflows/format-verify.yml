        with: { go-version-file: go.mod }
      - name: Generate secondary rung A (0x0E -> 0x0D, dependency_id -> sentinel)
        run: |
          mkdir -p artifacts-ladder-all-normal-sub
          go run ./cmd/gen-ladder-all-normal-sub -out artifacts-ladder-all-normal-sub
