version: 2

project_name: go-evtx

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  # The library itself ships through the module proxy, not as an artefact.
  # cmd/evtx is the one binary: naming its main package explicitly is also what
  # keeps the two fixture generators in cmd/ out of the release.
  - id: evtx
    main: ./cmd/evtx
    binary: evtx
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # No build filter here. The key that selects builds was renamed from
  # `builds` to `ids` after v2.7.0, which is the version CI pins — so naming
  # either one ties this file to a goreleaser version. There is exactly one
  # build, and an archive with no filter takes all of them, so the filter is
  # unnecessary in the first place.
  #
  # v0.8.0's release failed on precisely this: `goreleaser check` passed
  # locally against 2.17.1 and CI's 2.7.0 rejected `ids` with
  # "field ids not found in type config.Archive". Validate against the pinned
  # version, not the current documentation.
  - id: evtx
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: fjacquet
    name: go-evtx
  draft: false
  prerelease: auto
  name_template: '{{ .Tag }}'
  header: |
    See [CHANGELOG.md](https://github.com/fjacquet/go-evtx/blob/main/CHANGELOG.md) for full details.
  footer: |
    **Full Changelog**: https://github.com/fjacquet/go-evtx/compare/{{ .PreviousTag }}...{{ .Tag }}
